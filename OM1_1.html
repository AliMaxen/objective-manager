  function nextMove(){

  function renderStatus(){const closed=closedObjectives();const metrics=closed.map(o=>{const good=o.closed==='s', tasks=o.tasks.length, successes=o.tasks.filter(t=>t.s==='s').length;return{luck:good?100:20,eff:tasks?Math.round(successes/tasks*100):0,ded:good?90:35}});const avg=k=>metrics.length?Math.round(metrics.reduce((a,x)=>a+x[k],0)/metrics.length):0;return `<div class="page"><header class="topbar"><div><div class="eyebrow">Performance archive</div><div class="brand-title" style="margin-top:4px">Status</div><div class="brand-sub">Closed-objective outcomes.</div></div></header><div class="metric-grid"><div class="surface metric"><div class="metric-label">Luck</div><div class="metric-value">${avg('luck')}%</div><div class="metric-note">Outcome tendency</div></div><div class="surface metric"><div class="metric-label">Efficiency</div><div class="metric-value">${avg('eff')}%</div><div class="metric-note">Tasks resolved well</div></div><div class="surface metric"><div class="metric-label">Dedication</div><div class="metric-value">${avg('ded')}%</div><div class="metric-note">Follow-through</div></div><div class="surface metric"><div class="metric-label">Closed</div><div class="metric-value">${closed.length}</div><div class="metric-note">Recorded objectives</div></div></div><section class="surface section"><div class="section-head"><div><div class="section-title">Closed objectives</div><div class="section-note">Read-only outcome records.</div></div></div>${closed.length?`<div class="list spaced-list">${closed.slice().reverse().map(o=>`<article class="card recessed"><div class="item-row"><div class="item-main"><div class="item-title">${esc(o.title)}</div><div class="item-desc">${esc(o.closeReason||'Completed record')}</div><div class="item-meta"><span class="status-pill ${o.closed==='s'?'success':'danger'}"><span class="dot"></span>${lifecycleLabel(o)}</span><span class="chip">Value ${formatNum(objectiveValue(o))}</span></div></div><button class="mini-btn" data-action="preview-objective" data-id="${o.id}" type="button">View</button></div></article>`).join('')}</div>`:emptyState('No closed objectives','Once a Normal Objective resolves, its read-only record will appear here.','new-objective','Create objective')}</section></div>`;}

  function dayLabel(d){const p=(d.p||0)-(d.n||0),ratio=S.goal?Math.abs(p)/S.goal:0;if(p===0)return['No Performance Day','muted'];if(p<0&&ratio>=1)return['Doomsday','danger'];if(p<0&&ratio>=.5)return['A Very Tragic and Unlucky Day','danger'];if(p<0)return['Just a Bad Day','warning'];if(ratio>=1)return['A Brilliant Day','success'];if(ratio>=.5)return['Lucky Day','success'];return['Good Day','info'];}
  function renderDaily(){const entries=Object.entries(S.days).sort(([a],[b])=>b.localeCompare(a));return `<div class="page"><header class="topbar"><div><div class="eyebrow">Calendar intelligence</div><div class="brand-title" style="margin-top:4px">Daily</div><div class="brand-sub">Positive and negative movement stays auditable.</div></div></header><section class="surface section"><div class="section-head"><div><div class="section-title">Performance days</div><div class="section-note">Local calendar records.</div></div></div>${entries.length?`<div>${entries.map(([k,v])=>{const[l,c]=dayLabel(v);return `<div class="report-row"><div><div class="kpi"><strong>${formatDate(k)}</strong></div><div class="date-tag">${l}</div></div><div class="right"><div class="${c}">${v.p?'+':''}${formatNum((v.p||0)-(v.n||0))}</div><div class="date-tag">+${formatNum(v.p||0)} / -${formatNum(v.n||0)}</div></div></div>`}).join('')}</div>`:emptyState('No scored days','Daily reporting appears after the first scored action.','new-objective','Create objective')}</section></div>`;}

  function renderMonthly(){const base=new Date();base.setMonth(base.getMonth()+UI.monthlyOffset);const y=base.getFullYear(),m=base.getMonth(),key=monthKey(y,m);const days=Object.entries(S.days).filter(([k])=>k.startsWith(key));const p=days.reduce((a,[,v])=>a+num(v.p),0),n=days.reduce((a,[,v])=>a+num(v.n),0);const active=days.filter(([,v])=>num(v.p)||num(v.n)).length;return `<div class="page"><header class="topbar"><div><div class="eyebrow">Historical analysis</div><div class="brand-title" style="margin-top:4px">Monthly</div><div class="brand-sub">Aggregated from Daily performance records.</div></div></header><section class="surface section"><div class="calendar-head"><button class="icon-btn" data-action="month-prev" type="button" aria-label="Previous month">${icon('left','svg-icon')}<span class="sr">Previous</span></button><div class="calendar-title">${monthName(y,m)}</div><button class="icon-btn" data-action="month-next" type="button" aria-label="Next month">${icon('right')}<span class="sr">Next</span></button></div><div class="metric-grid" style="margin-top:16px"><div class="surface metric"><div class="metric-label">Net</div><div class="metric-value">${formatNum(p-n)}</div><div class="metric-note">Monthly movement</div></div><div class="surface metric"><div class="metric-label">Positive</div><div class="metric-value">${formatNum(p)}</div><div class="metric-note">Awarded value</div></div><div class="surface metric"><div class="metric-label">Negative</div><div class="metric-value">${formatNum(n)}</div><div class="metric-note">Lost value</div></div><div class="surface metric"><div class="metric-label">Active days</div><div class="metric-value">${active}</div><div class="metric-note">Scored dates</div></div></div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Month records</div><div class="section-note">${active} scored day${active===1?'':'s'}.</div></div></div>${days.length?days.sort(([a],[b])=>b.localeCompare(a)).map(([k,v])=>`<div class="report-row"><div><div class="kpi"><strong>${formatDate(k)}</strong></div><div class="date-tag">${dayLabel(v)[0]}</div></div><div class="right"><div class="${dayLabel(v)[1]}">${formatNum((v.p||0)-(v.n||0))}</div></div></div>`).join(''):emptyState('No data for this month','The Monthly surface is derived from Daily records and does not create a second source of truth.','new-objective','Create objective')}</section></div>`;}

  function renderProfile(){const hasPass=!!getPass();return `<div class="page"><header class="topbar"><div><div class="eyebrow">Identity & control</div><div class="brand-title" style="margin-top:4px">Profile</div><div class="brand-sub">Local storage, security and backup.</div></div></header><section class="surface section"><div class="section-head"><div><div class="section-title">Profile</div><div class="section-note">Your local program identity.</div></div></div><div class="form-row"><div class="field"><label for="profileName">Name</label><input id="profileName" maxlength="60" value="${esc(S.name)}"></div><div class="field"><label for="profileGoal">Goal value</label><input id="profileGoal" type="number" min="10" step="1" value="${S.goal}"></div></div><div class="actions" style="margin-top:14px"><button class="primary-btn" data-action="save-profile" type="button">${icon('check')} Save profile</button></div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Security</div><div class="section-note">4–12 digit PIN with inactivity lock.</div></div><span class="status-pill ${hasPass?'success':'muted'}"><span class="dot"></span>${hasPass?'Protected':'Unprotected'}</span></div><div class="actions">${hasPass?`<button class="ghost-btn" data-action="change-pass" type="button">${icon('lock')} Change PIN</button><button class="ghost-btn" data-action="remove-pass" type="button">${icon('x')} Remove</button><button class="ghost-btn" data-action="manual-lock" type="button">${icon('lock')} Lock now</button>`:`<button class="primary-btn" data-action="set-pass" type="button">${icon('lock')} Set PIN</button>`}</div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Advanced workspace</div><div class="section-note">Planning, scheduling, habit intelligence, analytics, sync and diagnostics.</div></div><button class="primary-btn" data-action="open-advanced" type="button">Open workspace</button></div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Backup</div><div class="section-note">Portable JSON with repair-friendly import.</div></div></div><div class="actions"><button class="ghost-btn" data-action="export" type="button">${icon('download')} Export</button><button class="ghost-btn" data-action="import" type="button">${icon('upload')} Import</button></div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Deletion</div><div class="section-note">Bulk deletion keeps profile/settings/security state.</div></div></div><div class="actions"><button class="danger-btn" data-action="delete-normal" type="button">${icon('trash')} Delete objectives</button><button class="danger-btn" data-action="delete-habits" type="button">${icon('trash')} Delete habits</button><button class="danger-btn" data-action="reset" type="button">${icon('trash')} Full reset</button></div></section><div class="footer-note">Local-only app · data stays in this browser unless you export it.</div></div>`;}

  function renderObjectivePreview(o){const done=o.tasks.filter(t=>t.s==='s').length,total=o.tasks.length,pct=total?Math.round(done/total*100):0;return `<div class="overlay-content surface-page" style="${identityVars(o)}"><div class="surface-head"><div><div class="eyebrow">${o.closed? 'Closed objective':'Objective preview'}</div><div class="surface-title">${esc(o.title)}</div></div><div class="actions"><button class="mini-btn" data-action="close-overlay" type="button">${icon('x')} Close</button>${o.closed?'':`<button class="mini-btn" data-action="edit-objective" data-id="${o.id}" type="button">${icon('edit')} Edit</button>`}<button class="mini-btn" data-action="delete-objective" data-id="${o.id}" type="button">${icon('trash')}</button></div></div><div class="grid grid-2"><section class="surface section"><div class="split"><div><div class="eyebrow">Progress</div><div class="large" style="margin-top:6px">${pct}%</div><div class="item-desc">${esc(o.desc||'No description.')}</div></div><div class="ring" style="--p:${pct}%"><span>${pct}%</span></div></div><div class="item-meta"><span class="chip">${lifecycleLabel(o)}</span><span class="chip">Value ${formatNum(objectiveValue(o))}</span><span class="chip">${esc(RISK[o.risk].name)}</span></div></section><section class="surface section"><div class="section-title">Details</div><div class="stack" style="margin-top:10px"><div class="report-row"><div class="kpi">Category</div><div>${esc(CATEGORIES[o.cat][0])}</div></div><div class="report-row"><div class="kpi">Chain links</div><div>${o.chain?.length||0}/2</div></div><div class="report-row"><div class="kpi">Reminder</div><div>${o.reminder?.enabled?esc(o.reminder.time):'Off'}</div></div></div></section></div><section class="surface section"><div class="section-head"><div><div class="section-title">Tasks</div><div class="section-note">${done}/${total} resolved.</div></div></div><div class="list spaced-list">${o.tasks.map(t=>taskPreview(o,t)).join('')}</div></section></div>`;}
  function taskPreview(o,t){return `<div class="task-row"><div class="task-copy"><span class="task-dot ${t.s}"></span><div class="item-main"><div class="item-title">${esc(t.t)} ${t.lead?'<span class="tag">PRIMARY</span>':''}</div><div class="item-meta"><span class="chip">${esc(PRIORITIES[t.p])}</span><span class="chip">${formatNum(t.v)}</span>${t.auto?'<span class="chip">AUTO</span>':''}</div></div></div>${o.closed?`<span class="tag">${t.s==='s'?'Done':'Failed'}</span>`:`<div class="task-actions">${t.s==='p'?`<button class="mini-btn" data-action="task-success" data-oid="${o.id}" data-tid="${t.id}" type="button">${icon('check')}</button><button class="mini-btn" data-action="task-fail" data-oid="${o.id}" data-tid="${t.id}" type="button">${icon('x')}</button>`:'<span class="tag">Resolved</span>'}</div>`}</div>`;}

  function renderHabitPreview(o){const h=o.habit,key=cycleKey(h.cleanTime,new Date(),h.timezone||LOCAL_TZ),rest=!selectedDay(h,key),count=num(h.logs[key],0),allowance=currentAllowance(h,key),pct=h.cessation?clamp((count/(allowance+3||1))*100,0,100):clamp((count/h.perDay)*100,0,100);const history=Object.values(h.history||{}).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);const editAllowed=!o.closed&&!Object.keys(h.logs||{}).length&&!h.successDays;return `<div class="overlay-content surface-page" style="${identityVars(o)}"><div class="surface-head"><div><div class="eyebrow">${h.cessation?'Cessation Habit':'Habit Objective'}</div><div class="surface-title">${esc(o.title)}</div></div><div class="actions"><button class="mini-btn" data-action="close-overlay" type="button">${icon('x')} Close</button>${editAllowed?`<button class="mini-btn" data-action="edit-habit" data-id="${o.id}" type="button">${icon('edit')} Edit</button>`:''}<button class="mini-btn" data-action="delete-habit" data-id="${o.id}" type="button">${icon('trash')}</button></div></div><section class="surface elevated section"><div class="split"><div><div class="eyebrow">${rest?'Rest day':o.closed?lifecycleLabel(o):(h.cessation?`Allowance ${allowance}`:`Target ${h.perDay}`)}</div><div class="large" style="margin-top:6px">${rest?'REST':count}</div><div class="item-desc">${esc(o.desc||'Daily repetition program.')}</div><div class="item-meta"><span class="chip">${formatDays(h.days)}</span><span class="chip">Clean ${esc(h.cleanTime)}</span>${h.cessation?`<span class="chip">Reduce ${h.reduce}%/week</span>`:''}</div></div><div class="ring" style="--p:${pct}%;"><span>${rest?'R':Math.round(pct)+'%'}</span></div></div><div class="actions" style="margin-top:14px"><button class="primary-btn" data-action="habit-step" data-id="${o.id}" type="button" ${rest||o.closed||(!h.cessation&&count>=h.perDay)||(h.cessation&&severity(h,key)==='fatal')?'disabled':''}>${icon('plus')} ${rest?'Rest day':o.closed?'Closed':!h.cessation&&count>=h.perDay?'Target reached':h.cessation&&count>=allowance?'Log extra':'Record repetition'}</button></div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Automatic milestones</div><div class="section-note">${h.successDays} successful target days.</div></div></div><div class="list">${(h.tasks||[]).map(t=>`<div class="task-row"><div class="task-copy"><span class="task-dot ${t.s}"></span><div><div class="item-title">${esc(t.t)}</div><div class="item-meta"><span class="chip">${formatNum(t.v)}</span><span class="chip">AUTO</span></div></div></div><span class="tag">${t.s==='s'?'Complete':'Pending'}</span></div>`).join('')}</div></section><section class="surface section"><div class="section-head"><div><div class="section-title">History</div><div class="section-note">Persistent checkpoint records.</div></div></div>${history.length?history.map(r=>`<div class="report-row"><div><div class="kpi"><strong>${formatDate(r.date)}</strong></div><div class="date-tag">${r.status==='success'?'Succeeded':r.status==='failed'?'Failed':'Rest Day'} · ${r.repetitions} reps</div></div><div class="right"><div class="${r.status==='success'?'success':r.status==='failed'?'danger':'muted'}">${r.status==='success'?(r.dailyValue?`+${formatNum(r.dailyValue)}`:'No points'):r.status==='failed'?`-${formatNum(o.habit.value)}`:'—'}</div><div class="date-tag">${esc(r.cleanTime)}</div></div></div>`).join(''):`<div class="empty"><p>No checkpoint history yet.</p></div>`}</section></div>`;}

  function newObjectiveDraft(){return{title:'',desc:'',color:'ember',base:20,risk:0,cat:0,exp:'',chain:[],reminder:{enabled:false,time:'09:00'},tasks:[{t:'Primary outcome',p:2,v:20,lead:true,exp:''}]};}

  function colorPicker(type,current){const eff=Math.round(scoreRatio(S)*100);return `<div class="field"><label>${type} identity color</label><div class="color-grid">${IDENTITY_COLORS.map(c=>{const locked=c.special&&!identityUnlocked(c.id);const bg=c.special?'linear-gradient(145deg,#adb4ba,#f5f7f8)':`linear-gradient(135deg,${c.a},${c.b})`;return `<button class="color-swatch ${current===c.id?'active':''}" data-action="select-color" data-form-color="${c.id}" type="button" title="${esc(c.name)}${locked?' · Unlocks at 50% efficiency':''}" aria-label="${esc(c.name)}" ${locked?'disabled':''}><span style="background:${bg}"></span>${locked?'<b class="color-lock">⌁</b>':''}</button>`}).join('')}</div><div class="hint">${eff>=50?'Silver Titanium is unlocked.':'Silver Titanium unlocks at 50% program efficiency.'}</div><input type="hidden" name="color" value="${esc(current)}"></div>`;}
  function renderObjectiveEditor(){const d=UI.draft.data, available=S.objs.filter(o=>o.type==='normal'&&o.id!==UI.draft.id&&o.closed!=='f');return `<div class="overlay-content surface-page"><div class="surface-head"><div><div class="eyebrow">${UI.draft.mode==='create'?'New':'Edit'} Objective</div><div class="surface-title">Make the win stupidly clear</div></div><button class="mini-btn" data-action="close-overlay" type="button">${icon('x')} Close</button></div><form id="objectiveForm" class="page"><section class="surface section"><div class="field-grid"><div class="field"><label>Title</label><input name="title" maxlength="50" required value="${esc(d.title)}" placeholder="What would feel really good to finish?"></div><div class="field"><label>Description</label><textarea name="desc" placeholder="What does done look like? Keep it concrete.">${esc(d.desc)}</textarea></div><div class="form-row"><div class="field"><label>Base value <span class="muted" id="baseOut">${num(d.base)}</span></label><input name="base" type="range" min="1" max="${Math.max(10,S.goal*2)}" value="${num(d.base)}"></div><div class="field"><label>Risk</label><select name="risk">${RISK.map((r,i)=>`<option value="${i}" ${num(d.risk)===i?'selected':''}>${esc(r.name)} · +${r.pct}%</option>`).join('')}</select></div></div><div class="field"><label>Category</label><div class="seg">${CATEGORIES.map((c,i)=>`<button class="seg-btn ${num(d.cat)===i?'active':''}" data-form-cat="${i}" type="button">${esc(c[0])}</button>`).join('')}</div><input type="hidden" name="cat" value="${num(d.cat)}"></div>${colorPicker('Objective',d.color||'ember')}<div class="field"><label>Expiration date</label><input name="exp" type="date" min="${today()}" value="${esc(d.exp||'')}"><span class="hint">Optional. A deadline is useful when it helps—not when it just adds pressure.</span></div></div></section><section class="surface section"><div class="section-head"><div><div class="section-title">Make the first move easy</div><div class="sec   function serializeBackup(){return {format:BACKUP,version:VERSION,exportedAt:new Date().toISOString(),features:['objectives','habit-objectives','daily-clean-progress','habit-history','statuses','chains','nested-projects','templates','checklists','recurring-tasks','dependencies','milestones','release-gates','custom-fields','attachments','calendar','scheduling','conflict-detection','time-budgeting','effort-tracking','catch-up','working-hours','blackouts','timezones','habit-intelligence','scoring-profiles','weights','ledger','badges','weekly-review','audit-log','burndown','cycle-time','reliability','aging','throughput','habit-heatmap','weekly-summary','multi-device-merge','roles','encrypted-sync','schema-migrations','property-tests','ui-snapshots','transactional-writes','indexeddb','offline-worker','diagnostics'],data:S};}
  async function exportData(){
    const fileName=`objective-manager-${today()}.json`;
    const json=JSON.stringify(serializeBackup(),null,2);
    const blob=new Blob([json],{type:'application/json'});
    try{
      if(typeof window.showSaveFilePicker==='function'){
        const handle=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'Objective Manager backup',accept:{'application/json':['.json']}}]});
        const writable=await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        toast(`Backup saved as ${handle.name}.`);
        return;
      }
    }catch(err){
      if(err?.name==='AbortError'){
        toast('Backup export canceled. Nothing was changed.');
        return;
      }
      console.warn('Save picker failed; falling back to browser download.',err);
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Backup sent to your browser’s download location.');
  }

></div><div class="field"><label>Forgiveness</label><input data-habit-meta="forgive" data-id="${o.id}" type="number" min="0" max="7" value="${num(h.rules?.forgive,3)}"></div></div><div class="form-row" style="margin-top:8px"><div class="field"><label>Failure at</label><input data-habit-meta="failureAt" data-id="${o.id}" type="number" min="1" max="60" value="${num(h.rules?.failureAt,h.perDay+3)}"></div><div class="field"><label>Freeze start</label><input data-habit-meta="freezeStart" data-id="${o.id}" type="date" value="${esc(h.freezeStart||'')}"></div><div class="field"><label>Freeze end</label><input data-habit-meta="freezeEnd" data-id="${o.id}" type="date" value="${esc(h.freezeEnd||'')}"></div></div><div class="field" style="margin-top:8px"><label>Recovery plan</label><input data-habit-meta="recoveryPlan" data-id="${o.id}" value="${esc(h.recoveryPlan||'')}"></div><button class="ghost-btn small-control" style="margin-top:8px" data-action="adv-save-habit-meta" data-id="${o.id}" type="button">Save habit controls</button></div>`}).join('')||'<div class="advanced-note">No habits yet.</div>'}</section></section>`:''}
    <section class="advanced-grid cols-2"><section class="surface advanced-section"><div class="section-head"><div><div class="section-title">Analytics</div><div class="section-note">Burndown/burnup, cycle time, reliability, overdue aging, throughput and habit heatmap.</div></div></div><div class="advanced-kpis"><div class="advanced-kpi"><strong>${cycles.avg.toFixed(1)}d</strong><span>Avg cycle time</span></div><div class="advanced-kpi"><strong>${Math.round(closedObjectives().length?closedObjectives().filter(o=>o.closed==='s').length/closedObjectives().length*100:0)}%</strong><span>Reliability</span></div><div class="advanced-kpi"><strong>${throughput()}</strong><span>Throughput / 14d</span></div><div class="advanced-kpi"><strong>${Object.values(aging).reduce((a,b)=>a+b,0)}</strong><span>Overdue aging</span></div></div><div class="report-bars" style="margin-top:12px">${burndown.map((x,i)=>`<div class="report-bar" title="Remaining ${Math.round(x.remaining)} min · Burnup ${Math.round(x.burnup)} min"><span style="height:${Math.max(6,(x.remaining/(burndown[0].remaining||1))*100)}%"></span><small>${i+1}</small></div>`).join('')}</div><div class="tag-grid" style="margin-top:10px">${Object.entries(aging).map(([k,v])=>`<span class="feature-pill">${esc(k)} ${v}</span>`).join('')}</div><div class="tag-grid" style="margin-top:8px">${Object.entries(cycleTimeDistribution()).map(([k,v])=>`<span class="feature-pill">Cycle ${esc(k)} ${v}</span>`).join('')}</div><div class="heatmap" style="margin-top:12px">${heat.map(x=>`<div class="heat-cell" data-level="${x.targeted===0?0:x.rate>=1?4:x.rate>=.75?3:x.rate>=.5?2:1}" title="${esc(formatDate(x.date))}: ${x.success}/${x.targeted}"></div>`).join('')}</div></section><section class="surface advanced-section"><div class="section-head"><div><div class="section-title">Score ledger + badges</div><div class="section-note">Every value change gets a reason. Achievements stay quiet.</div></div></div><div class="tag-grid" style="margin-bottom:10px">${(S.badges||[]).map(b=>`<span class="feature-pill diag-pass">✓ ${esc(b)}</span>`).join('')||'<span class="advanced-note">No badges yet.</span>'}</div><div class="list">${S.ledger.slice(-8).reverse().map(e=>`<div class="report-row"><div><div class="kpi"><strong>${e.delta>=0?'+':''}${formatNum(e.delta)}</strong></div><div class="date-tag">${esc(e.reason)}</div></div><div class="date-tag">${esc(e.date)}</div></div>`).join('')||'<div class="advanced-note">No scored changes yet.</div>'}</div></section></section>
    <section class="advanced-grid cols-2"><section class="surface advanced-section"><div class="section-head"><div><div class="section-title">Local collaboration + sync</div><div class="section-note">Portable multi-device merge, local role metadata and conflict records. True live sharing needs a server.</div></div></div><div class="form-row"><div class="field"><label>Project ID</label><input id="collabProject" value="${esc(S.workspace.collab.projectId||'local')}"></div><div class="field"><label>Your role</label><select id="collabRole"><option ${S.workspace.collab.role==='Owner'?'selected':''}>Owner</option><option ${S.workspace.collab.role==='Editor'?'selected':''}>Editor</option><option ${S.workspace.collab.role==='Viewer'?'selected':''}>Viewer</option></select></div></div><div class="actions" style="margin-top:8px"><button class="primary-btn" data-action="adv-save-collab" type="button">Save role</button><button class="ghost-btn" data-action="adv-export-encrypted" type="button">Encrypted sync</button><button class="ghost-btn" data-action="adv-import-merge" type="button">Merge backup</button></div><div class="advanced-note" style="margin-top:8px">${S.workspace.mergeConflicts?.length||0} merge conflicts recorded · device ${esc(String(S.workspace.deviceId||'local').slice(0,10))}…</div></section><section class="surface advanced-section"><div class="section-head"><div><div class="section-title">Reliability + diagnostics</div><div class="section-note">Migration, property checks, audit trail, snapshot manifest, journal writes, IndexedDB mirror and offline worker.</div></div></div><div class="actions"><button class="ghost-btn" data-action="adv-run-tests" type="button">Run diagnostics</button><button class="ghost-btn" data-action="adv-snapshot" type="button">UI snapshot</button><button class="ghost-btn" data-action="adv-export-sw" type="button">Prepare offline worker</button></div><div class="tag-grid" style="margin-top:12px">${tests.map(t=>`<span class="feature-pill ${t.ok?'diag-pass':'diag-warn'}">${t.ok?'✓':'!'} ${esc(t.name)}</span>`).join('')}</div><div class="advanced-note" style="margin-top:10px">Schema ${S.schemaVersion} · events ${S.events.length} · telemetry-free.</div></section></section></div>`;
  }

  function snapshotManifest(){return{version:VERSION,viewport:{w:window.innerWidth,h:window.innerHeight},components:{cards:document.querySelectorAll('.card').length,buttons:document.querySelectorAll('button').length,inputs:document.querySelectorAll('input,textarea,select').length},timestamp:new Date().toISOString()}}
  function renderOverlayEditor(){if(UI.overlay==='objective-editor')document.getElementById('o').innerHTML=renderObjectiveEditor();else if(UI.overlay==='habit-editor')document.getElementById('o').innerHTML=renderHabitEditor();else if(UI.overlay==='advanced')document.getElementById('o').innerHTML=renderAdvanced();syncShell();}
  window.addEventListener('popstate',()=>{if(UI.backSyncing){UI.backSyncing=false;return}if(UI.dialog){UI.backDepth=Math.max(0,UI.backDepth-1);closeDialog(true);return}if(UI.overlay){UI.backDepth=Math.max(0,UI.backDepth-1);closeOverlay(true);return}history.pushState({om:true,depth:0},'');});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(handleBack())e.preventDefault()}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){touch();maybeAutoLock();resolveExpired();processAllHabits();render()}});
  setInterval(()=>{maybeAutoLock();if(!UI.lock){resolveExpired();processAllHabits();checkReminders();render()}},15000);

  async function init(){load();history.replaceState({om:true,depth:0},'');window.scrollTo(0,0);const owlEl=document.getElementById('loaderOwl'),fabEl=document.getElementById('fab');if(owlEl)owlEl.innerHTML=owl();if(fabEl)fabEl.innerHTML=icon('plus');await new Promise(r=>setTimeout(r,120));const loader=document.getElementById('loader'),app=document.getElementById('app');if(loader)loader.classList.add('hide');if(app)app.classList.remove('hidden');if(getPass()&&Date.now()-num(localStorage.getItem(LAST),Date.now())>=AUTO_LOCK_MS)enterLock();else{processAllHabits();resolveExpired();render();}setTimeout(()=>document.getElementById('loader')?.remove(),400);}
  init();
})();
</script>
</body>
</html>
