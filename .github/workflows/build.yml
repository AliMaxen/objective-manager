name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Pillow
        run: |
          pip install Pillow

      - name: Create Android project
        run: |
          mkdir www
          cp OM1_1.html www/index.html

          npm init -y

          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          npx cap init "Objective Manager" com.roy.objectivemanager --web-dir www

          npx cap add android

      - name: Convert JPG to PNG
        run: |
          mkdir -p resources

          python - <<'PY'
          from PIL import Image

          img = Image.open("1790377848177.jpg")
          img = img.convert("RGBA")
          img.save("resources/icon.png")

          print("Icon converted successfully.")
          print(f"Icon size: {img.width}x{img.height}")
          PY

      - name: Generate Android app icons
        run: |
          npx capacitor-assets generate

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: objective-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
