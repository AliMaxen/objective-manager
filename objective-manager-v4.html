<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Objective Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pg:#d4e0f5;--bg:#e3ebfc;--tx:#4a3d7a;--mu:#9891bd;--sd:rgba(150,170,214,.6);--sl:rgba(255,255,255,.95);--ac:#6c8cff;--tr:rgba(150,160,205,.28)}
[data-t=dark]{--pg:#211b44;--bg:#2a2352;--tx:#ebe6ff;--mu:#9d95c9;--sd:rgba(12,8,34,.6);--sl:rgba(255,255,255,.05);--tr:rgba(160,150,220,.2)}
*{box-sizing:border-box;margin:0;font-family:"Plus Jakarta Sans","Manrope","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--pg);color:var(--tx);min-height:100vh;font-weight:500;overflow-x:hidden;padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom));transition:background .5s,color .5s}
#m.an{animation:sw .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sw{from{opacity:0;transform:translateX(var(--dx))}}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 2px}
.top>span{width:44px}.tt{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--mu)}
.rb2{width:44px;height:44px;padding:0;display:grid;place-items:center}
.c{background:var(--bg);border-radius:34px;padding:20px;margin:16px 14px;box-shadow:12px 12px 28px var(--sd),-10px -10px 24px var(--sl)}
.i{background:var(--bg);color:var(--tx);border:0;border-radius:20px;padding:14px 16px;width:100%;font-size:15px;font-weight:500;outline:none;box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl)}
.i::placeholder{color:var(--mu)}
.b{background:var(--bg);color:var(--tx);border:0;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;box-shadow:6px 6px 14px var(--sd),-5px -5px 12px var(--sl);transition:box-shadow .25s,transform .2s,background .3s}
.b:active{transform:scale(.95);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.b.on{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.b:disabled{opacity:.4}
.pb{background:linear-gradient(145deg,#7d97ff,#5b7cf6);color:#fff;box-shadow:6px 9px 20px rgba(92,124,246,.45),-4px -4px 12px var(--sl)}
.row{display:flex;flex-wrap:wrap;gap:10px}
label{font-size:13px;color:var(--mu);font-weight:600}
.ch{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex:none;box-shadow:0 0 0 1px rgba(120,110,170,.3)}
.bar{position:relative;height:8px;border-radius:8px;margin-top:18px;background:var(--tr);box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.bar i{display:block;position:relative;height:100%;border-radius:8px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.hero .bar i::after{content:"";position:absolute;right:-11px;top:-8px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,currentColor 30%,#fff 34%);box-shadow:3px 4px 9px var(--sd)}
.lab{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:12px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;outline:none;background:linear-gradient(90deg,var(--c,#6c8cff) var(--p,0%),var(--tr) var(--p,0%));box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,var(--c,#6c8cff) 30%,#fff 34%);box-shadow:4px 5px 12px var(--sd)}
#nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;padding:8px;border-radius:999px;background:var(--bg);box-shadow:10px 10px 26px var(--sd),-8px -8px 20px var(--sl);z-index:2}
#ind{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 16px)/4);border-radius:999px;background:linear-gradient(145deg,#7d97ff,#5b7cf6);box-shadow:0 8px 18px rgba(92,124,246,.45);transition:transform .5s cubic-bezier(.5,1.5,.4,1)}
#nav .b{position:relative;z-index:1;flex:1;padding:13px 2px;background:none;box-shadow:none;font-size:13px;font-weight:700;color:var(--mu);transition:color .3s}
#nav .b.on{color:#fff}
#fab{position:fixed;right:22px;bottom:calc(100px + env(safe-area-inset-bottom));width:60px;height:60px;padding:0;font-size:30px;font-weight:400;z-index:2}
.hero{position:relative;text-align:center;overflow:hidden;padding-top:30px}
.hero>*:not(.deco){position:relative}
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fl{animation:fy 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
@keyframes fy{50%{transform:translateY(-7px)}}
.disc{width:216px;height:216px;margin:0 auto;border-radius:50%;background:var(--bg);box-shadow:12px 12px 28px var(--sd),-10px -10px 24px var(--sl);display:grid;place-items:center}
.disc>svg:not(.ring){filter:drop-shadow(0 8px 8px rgba(110,95,180,.28))}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.rt{stroke:var(--tr)}.rf{transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1),stroke .5s}
.big{font-size:46px;font-weight:700;line-height:1;margin-top:24px}
.sub{font-size:15px;color:var(--mu);margin-top:8px;font-weight:600}
.ctl{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:26px}
.rb{width:74px;height:74px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:6px 6px 14px var(--sd),-5px -5px 12px var(--sl)}
.rb b{font-size:20px;font-weight:700}.rb small{font-size:10px;color:var(--mu);font-weight:600}
.rb.pb{width:94px;height:94px;color:#fff}.rb.pb small{color:#e6ecff}
.eyes{transform-box:fill-box;transform-origin:center;animation:bl 5s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.row2{display:flex;gap:14px;align-items:center;padding:16px 18px;cursor:pointer;border-radius:30px}
.go{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:5px 5px 12px var(--sd),-4px -4px 10px var(--sl)}
#o{position:fixed;inset:0;background:var(--pg);overflow:auto;padding:env(safe-area-inset-top) 0 40px;z-index:5;display:none}
#o.up{animation:up .5s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(44px)}}
#t{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--bg);color:var(--tx);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;max-width:90%;text-align:center;box-shadow:8px 8px 20px var(--sd),-6px -6px 16px var(--sl)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/*v3*/
:root{--bgc:linear-gradient(145deg,#f7faff,#e1eafb);--pgc:linear-gradient(165deg,#fffdf9 0%,#edf2fd 42%,#d4e1f6 100%);--wh:#f9fbff}
[data-t=dark]{--bgc:linear-gradient(145deg,#322b68,#282150);--pgc:linear-gradient(165deg,#2e2762,#1b163e);--wh:#2b2454}
body{background:var(--pgc) fixed;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
#o{background:var(--pgc)}
.c,.b,.disc,.rb,#nav,.dg{background:var(--bgc)}
.pb{background:linear-gradient(145deg,#7d97ff,#5b7cf6)}
.c{margin:26px 20px;padding:26px}
.top{padding:30px 28px 8px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.i{padding:15px 18px}.row{gap:14px}
.row2{padding:22px 24px;gap:18px}
#nav .b{flex-direction:column;gap:3px;padding:10px 2px;background:none;font-size:10px}
#fab{bottom:calc(104px + env(safe-area-inset-bottom))}
.go.s{color:#62bd98}.go.f{color:#e07a86}
.tk .go{width:44px;height:44px}
#m>.tap,#o .tap{animation:tp .17s ease}@keyframes tp{50%{transform:scale(.96)}}
#m>*,#o.pv>*{animation:cu .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes cu{from{opacity:0;transform:translateY(16px)}}
.rt2{fill:none;stroke:var(--tr);stroke-width:7}
.rg{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:0 999;transition:stroke-dasharray 1.2s cubic-bezier(.4,0,.2,1)}
.day{display:flex;justify-content:space-between;align-items:center}.net{font-size:32px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}.kv span{color:var(--mu)}
#dlg{position:fixed;inset:0;z-index:8;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}
#dlg.on{opacity:1;pointer-events:auto}
.bd{position:absolute;inset:0;background:rgba(70,58,120,.28);backdrop-filter:blur(6px)}
.dg{position:relative;width:min(88%,380px);padding:28px;border-radius:36px;box-shadow:14px 14px 34px var(--sd),-8px -8px 22px var(--sl);transform:scale(.88) translateY(18px);transition:transform .45s cubic-bezier(.2,1.25,.3,1)}
#dlg.on .dg{transform:none}
#t.sh{animation:ts 2.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ts{0%{opacity:0;transform:translate(-50%,-26px) scale(.94)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}

/*v4*/
:root{--bgc:linear-gradient(145deg,#f9fbff,#eaf0fc);--pgc:linear-gradient(170deg,#fffef9 0%,#f4f7fd 50%,#e3ebf9 100%)}
[data-t=dark]{--bgc:linear-gradient(145deg,#302964,#2a2354);--pgc:linear-gradient(170deg,#2c2560,#211b47)}
.pb,#ind{background:linear-gradient(145deg,#89a1fb,#6d88f6)}
#ind{width:calc((100% - 16px)/5)}
.rk{display:flex;flex-direction:column;gap:14px}
.rkb{position:relative;width:100%;height:46px;padding:0;border-radius:23px;overflow:hidden;display:flex;opacity:.7}
.rkb.on{opacity:1;outline:2px solid #90a5f4;outline-offset:2px}
.rkb svg{position:absolute;inset:0;width:100%;height:100%}
.rkb span{position:relative;text-align:center;font-weight:700;font-size:14px;line-height:46px}
.bar i{background-size:200% 100%;animation:gr 1.1s cubic-bezier(.4,0,.2,1) both,wv 5s linear infinite}
@keyframes gr{from{width:0}}@keyframes wv{to{background-position:-200% 0}}
.tg{display:grid;grid-template-columns:1fr 1fr;margin:8px 6px}
.tl{margin:14px;padding:22px;display:flex;flex-direction:column;gap:8px}.tl small{color:var(--mu);font-size:12px}.tl b{font-size:20px}
.rg{filter:drop-shadow(0 0 5px rgba(140,160,240,.3))}

/* v5 - persistence, lock, backup, command-center loader */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');
#loader{position:fixed;inset:0;z-index:2500;display:grid;place-items:center;background:var(--pgc);padding:24px;transition:opacity .55s ease,visibility .55s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-card{width:min(92vw,430px);padding:42px 28px 38px;border-radius:44px;text-align:center;background:var(--bgc);box-shadow:18px 18px 42px var(--sd),-12px -12px 30px var(--sl);animation:loaderRise .7s cubic-bezier(.2,.8,.2,1)}
.loader-logo{width:min(58vw,230px);height:min(58vw,230px);object-fit:cover;border-radius:50%;display:block;margin:0 auto 25px;box-shadow:12px 14px 28px var(--sd),-8px -8px 22px var(--sl);animation:owlBlink 2.8s ease-in-out infinite}
.loader-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:42px;line-height:1;font-weight:700;letter-spacing:.045em;color:var(--tx)}
.loader-sub{margin-top:10px;font-size:11px;letter-spacing:.25em;color:var(--mu);font-weight:700}
@keyframes loaderRise{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes owlBlink{0%,42%,48%,100%{filter:brightness(1);transform:scale(1)}45%{filter:brightness(.82);transform:scale(.985)}}
#lockScreen{position:fixed;inset:0;z-index:2000;display:none;overflow:auto;background:var(--pgc);padding:calc(24px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));align-items:center;justify-content:center}
#lockScreen.on{display:flex;animation:lockIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes lockIn{from{opacity:0;transform:scale(.98)}}
body.isLocked{overflow:hidden}
.lock-card{width:min(94vw,390px);padding:30px 24px 24px;border-radius:38px;background:var(--bgc);box-shadow:18px 18px 42px var(--sd),-12px -12px 30px var(--sl);text-align:center}
.lock-logo{width:100px;height:100px;object-fit:cover;border-radius:50%;box-shadow:9px 10px 22px var(--sd),-7px -7px 18px var(--sl);margin-bottom:13px}
.lock-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:31px;font-weight:700;letter-spacing:.04em}
.lock-caption{font-size:12px;color:var(--mu);margin-top:4px}
.pin-dots{height:43px;display:flex;justify-content:center;align-items:center;gap:11px;margin:20px 0 14px}
.pin-dot{width:11px;height:11px;border-radius:50%;background:var(--tr);box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);transition:.18s}
.pin-dot.on{background:#7d97ff;box-shadow:0 0 0 3px rgba(125,151,255,.13),3px 4px 9px var(--sd)}
.pin-error{min-height:18px;color:#d87585;font-size:12px;font-weight:700;margin-bottom:5px}
.pin-pad{display:grid;grid-template-columns:repeat(3,minmax(68px,1fr));gap:11px;margin:14px auto 17px;max-width:314px}
.pin-key{height:58px!important;min-width:0;padding:0!important;border-radius:19px!important;font-size:18px!important;line-height:1!important;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease,background .15s ease!important}
.pin-key.small{font-size:13px!important;color:var(--mu);font-weight:700}
.pin-key:active{transform:scale(.94)!important;box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)!important}
.pin-key:focus-visible{outline:2px solid #8da5f6;outline-offset:2px}
.pin-forgot{border:0;background:none;color:var(--mu);font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px;cursor:pointer;touch-action:manipulation}
.pass-step{font-size:11px;color:var(--mu);letter-spacing:.12em;font-weight:700;text-transform:uppercase}
.pass-status{font-size:12px;color:var(--mu);line-height:1.45;text-align:center;margin-top:4px}
.backup-row{display:flex;gap:12px;flex-wrap:wrap}
.backup-row .b{flex:1;min-width:145px}
#dlg .dg.pass-dialog{padding:27px}

.owl-decor{width:118px;height:118px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 12px;box-shadow:10px 12px 24px var(--sd),-7px -7px 18px var(--sl);transition:transform .35s ease;}
.owl-decor.fail{animation:owlBonk .72s cubic-bezier(.2,.8,.2,1) both;}
.owl-decor.success{animation:owlFly .95s cubic-bezier(.2,.8,.2,1) both;}
@keyframes owlBonk{0%{transform:rotate(0) scale(1)}18%{transform:rotate(-8deg) translateX(-3px)}35%{transform:rotate(9deg) translateX(4px)}52%{transform:rotate(-6deg) translateY(5px) scale(.97)}68%{transform:rotate(5deg) translateY(2px)}82%{transform:rotate(-2deg)}100%{transform:rotate(0) scale(1)}}
@keyframes owlFly{0%{transform:translate(0,0) scale(1);opacity:1}18%{transform:translate(-4px,-6px) rotate(-3deg)}45%{transform:translate(10px,-18px) rotate(4deg) scale(1.03)}100%{transform:translate(125px,-150px) rotate(10deg) scale(.62);opacity:0}}
.owl-hit{height:18px;color:var(--mu);font-size:11px;opacity:0;transition:opacity .2s}.owl-hit.on{opacity:1}
.security-actions{display:flex;flex-direction:column;gap:9px;margin-top:8px}.security-actions .b{width:100%}

/* v7 responsive security + fluid controls + reminders */
body.isLocked #m,body.isLocked #nav,body.isLocked #fab,body.isLocked #o,body.isLocked #dlg,body.isLocked #t{visibility:hidden!important;pointer-events:none!important}
.pin-key{touch-action:manipulation;user-select:none;-webkit-user-select:none;will-change:transform;transition:transform .12s,box-shadow .12s}
.pin-key:active{transform:scale(.92);}
.pin-pad{contain:layout paint}
.water-range{height:14px!important;border-radius:999px!important;background:linear-gradient(90deg,rgba(125,151,255,.92) 0%,rgba(154,192,255,.72) var(--p,0%),var(--tr) var(--p,0%))!important;box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)!important;position:relative;overflow:visible}
.water-range::-webkit-slider-thumb{width:36px!important;height:36px!important;border:0!important;border-radius:50%!important;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#cfe0ff 17% 38%,#89a7ff 39% 70%,#7190ef 71%)!important;box-shadow:6px 8px 15px var(--sd),-4px -4px 10px var(--sl),inset 2px 2px 4px rgba(255,255,255,.75)!important;transition:transform .18s cubic-bezier(.2,1.5,.3,1),filter .2s!important}
.water-range:active::-webkit-slider-thumb{transform:scale(1.12);filter:saturate(1.15)}
.water-range::-moz-range-thumb{width:36px;height:36px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#cfe0ff 17% 38%,#89a7ff 39% 70%,#7190ef 71%);box-shadow:6px 8px 15px var(--sd),-4px -4px 10px var(--sl);}
.water-wrap{padding:17px 10px 8px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(175,195,235,.14));box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);overflow:hidden}
.water-wave{height:8px;margin-top:-11px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);animation:waterWave 2.2s linear infinite;pointer-events:none;opacity:.7}
@keyframes waterWave{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.water-slider{position:relative;padding:18px 10px 12px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(175,195,235,.16));box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);overflow:visible}
.water-slider .water-range{position:relative;z-index:2;margin:0}
.water-fill{position:absolute;left:10px;right:10px;top:18px;height:14px;border-radius:999px;overflow:hidden;pointer-events:none;background:rgba(145,166,220,.17);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.water-fill i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#9ab6ff,#7f9cf7,#a7c7ff);box-shadow:0 2px 8px rgba(125,151,255,.25);transition:width .12s linear}
.water-slider .water-wave{position:absolute;left:8px;right:8px;top:20px;height:10px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:waterWave 2.2s linear infinite;pointer-events:none;opacity:.55;z-index:3}
.water-slider .water-range{height:14px!important;border-radius:999px!important;background:transparent!important;box-shadow:none!important}
.water-range::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:transparent}
.water-range::-moz-range-track{height:14px;border-radius:999px;background:transparent}
.water-range::-webkit-slider-thumb{width:36px!important;height:36px!important;margin-top:-11px;border:0!important;border-radius:50%!important;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#d8e5ff 17% 36%,#9ab3ff 37% 67%,#7895f0 68%)!important;box-shadow:6px 8px 15px var(--sd),-4px -4px 10px var(--sl),inset 2px 2px 4px rgba(255,255,255,.75)!important;transition:transform .15s cubic-bezier(.2,1.45,.3,1),filter .2s!important}
.water-range:active::-webkit-slider-thumb{transform:scale(1.1);filter:saturate(1.12)}
.water-range::-moz-range-thumb{width:36px;height:36px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#d8e5ff 17% 36%,#9ab3ff 37% 67%,#7895f0 68%);box-shadow:6px 8px 15px var(--sd),-4px -4px 10px var(--sl);transition:transform .15s cubic-bezier(.2,1.45,.3,1)}
.water-range:active::-moz-range-thumb{transform:scale(1.1)}
.objective-title{font-size:15px!important}
.objective-description{display:block!important;width:100%!important;height:150px!important;min-height:150px!important;max-height:150px!important;resize:none!important;overflow-y:auto;line-height:1.55}
.rk{display:flex;flex-direction:column;gap:13px}

const cookieSet=(name,value,maxAge=31536000)=>{try{document.cookie=name+'='+encodeURIComponent(value)+'; Max-Age='+maxAge+'; Path=/; SameSite=Strict'}catch(e){}};
const cookieGet=name=>{try{const m=document.cookie.match(new RegExp('(?:^|; )'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}catch(e){return null}};
const b64u=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(pin,salt){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin)))}
function getStoredPass(){
  try{
    const c=cookieGet('om_lock');
    if(c){const r=JSON.parse(c);if(r&&r.salt&&r.hash)return r}
    const l=JSON.parse(localStorage.getItem('om_pass')||'null');
    if(l&&l.salt&&l.hash){cookieSet('om_lock',JSON.stringify(l));return l}
  }catch(e){}
  return null;
}
async function setStoredPass(pin){
  const salt=b64u(crypto.getRandomValues(new Uint8Array(16)));
  const record={v:2,salt,hash:await pinHash(pin,salt)};
  cookieSet('om_lock',JSON.stringify(record),31536000);
  /* Local-file browsers can disable cookies. Keep a device-local mirror solely as compatibility fallback. */
  localStorage.setItem('om_pass',JSON.stringify(record));
}
async function verifyPin(pin){const r=getStoredPass();return !!(r&&r.salt&&r.hash&&(await pinHash(pin,r.salt))===r.hash)}
function clearPassword(){localStorage.removeItem('om_pass');localStorage.removeItem('om_locked');cookieSet('om_lock','',0)}
const pinDots=(n,max=12)=>Array.from({length:max},(_,i)=>`<i class="pin-dot${i<n?' on':''}"></i>`).join('');
const pinPad=(fn='pinKey',back='pinBack',submit='pinSubmit')=>['1','2','3','4','5','6','7','8','9','back','0','ok'].map(x=>{const b=x==='back',k=x==='ok';return `<button type="button" class="b pin-key${b?' small':''}${k?' pin-ok':''}" aria-label="${b?'Delete':k?'Confirm':x}" onclick="${b?back+'()':k?submit+'()':fn+"('"+x+"')"}">${b?'&#9003;':k?ic('ok',22):x}</button>`}).join('');
function updatePinUI(error=''){
 const dots=$('#pinDots');if(dots)dots.innerHTML=pinDots(pinValue.length,12);
 const err=$('#pinError');if(err)err.textContent=error||'';
}
function renderUnlock(error='',state=''){
  const lock=$('#lockScreen');
  lock.innerHTML=`<div class="lock-card">
    <img class="owl-decor ${state}" src="${OWL_IMAGE}" alt="decorative owl" id="unlockOwl">
    <div class="owl-hit ${state==='fail'?'on':''}">${state==='fail'?'The owl has reconsidered your password.':' '}</div>
    <div class="lock-title">Command Center</div><div class="lock-caption">ACCESS LOCKED</div>
    <div id="pinDots" class="pin-dots">${pinDots(pinValue.length,12)}</div><div id="pinError" class="pin-error">${esc(error)}</div>
    <div class="pin-pad">${pinPad()}</div>
    <button class="pin-forgot" onclick="forgotPassword()">Forgot password? Reset all data</button>
  </div>`;
}
function showLock(reason=''){if(!getStoredPass()){toast('Set a password first');return}locked=true;try{localStorage.setItem('om_locked','1')}catch(e){}pinValue='';pinMode='unlock';document.body.classList.add('isLocked');$('#lockScreen').classList.add('on');renderUnlock(reason)}
function hideLock(){locked=false;try{localStorage.removeItem('om_locked')}catch(e){}pinValue='';$('#lockScreen').classList.remove('on');document.body.classList.remove('isLocked');touch()}
async function pinSubmit(){
  if(pinValue.length<4){renderUnlock('Use at least 4 digits.');return}
  const ok=await verifyPin(pinValue);
  if(ok){renderUnlock('', 'success');setTimeout(()=>{hideLock();R0();toast('Access restored')},720)}
  else{pinValue='';renderUnlock('Incorrect password.','fail');}
}
function pinKey(d){if(pinValue.length>=12)return;pinValue+=d;updatePinUI('')}
function pinBack(){pinValue=pinValue.slice(0,-1);updatePinUI('')}
function manualLock(){if(!getStoredPass()){openPasswordSetup();return}touch();showLock()}
function autoLockCheck(){const last=+(localStorage.getItem('om_last_active')||Date.now());if(!locked&&getStoredPass()&&Date.now()-last>=LOCK_MS)showLock('Auto-locked after 1 hour.')}
function resetAllData(){
  try{localStorage.clear()}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  clearPassword();
  /* Clear all cookies available to this origin, not merely the security cookie. */
  try{document.cookie.split(';').forEach(c=>{const n=c.split('=')[0].trim();if(n)cookieSet(n,'',0)})}catch(e){}
  location.reload();
}

 const lock=$('#lockScreen');
 lock.innerHTML=`<div class="lock-card"><img class="owl-decor" src="${OWL_IMAGE}" alt="decorative owl"><div class="lock-title">Reset access?</div><div class="lock-caption">FORGOT PASSWORD</div><p style="color:var(--mu);margin:18px 4px 24px;line-height:1.6;font-size:14px">The password cannot be recovered. Continuing will permanently erase every objective, task, history, setting, reminder, backup-related application state and the password itself.</p><div class="row"><button type="button" class="b" style="flex:1" onclick="renderUnlock('')">Cancel</button><button type="button" class="b pb" style="flex:1" onclick="resetAllData()">Reset everything</button></div></div>`;
}

function passSetupKey(d){if(pinValue.length>=12)return;pinValue+=d;updatePinUI('')}
function passSetupBack(){pinValue=pinValue.slice(0,-1);updatePinUI('')}
function renderPasswordSetup(error=''){
  const step=(pinMode==='setup-confirm'||pinMode==='change-confirm')?'Confirm password':pinMode==='change-new'?'New password':'Create password';

}
function openPasswordSetup(){pinMode='setup';pinValue='';pinFirst='';dg(`<div class="pass-dialog"></div>`);renderPasswordSetup()}
async function passSetupSubmit(){
  if(pinValue.length<4){renderPasswordSetup('Use at least 4 digits.');return}
  if(pinMode==='change-new'){
    pinFirst=pinValue;pinValue='';pinMode='change-confirm';renderPasswordSetup();return;
  }
  if(pinMode==='setup'){pinFirst=pinValue;pinValue='';pinMode='setup-confirm';renderPasswordSetup();return}
  if(pinValue!==pinFirst){pinValue='';renderPasswordSetup('The two passwords do not match.');return}
  try{await setStoredPass(pinValue);localStorage.setItem('om_last_active',String(Date.now()));dc();toast(pinMode==='change-confirm'?'Password changed':'Password protection enabled');R0()}catch(e){pinValue='';renderPasswordSetup('Could not save the password on this device.')}
}
function beginPasswordChange(){if(!getStoredPass()){openPasswordSetup();return}pinMode='auth-change';pinValue='';pendingSecurityAction='change';dg(`<div class="pass-dialog"></div>`);renderSecurityAuth('Change password','Enter your current password first.')}
function beginPasswordRemoval(){if(!getStoredPass()){toast('No password protection is active');return}pendingSecurityAction='remove';pinMode='auth-remove';pinValue='';dg(`<div class="pass-dialog"></div>`);renderSecurityAuth('Remove password protection','Enter your current password to continue.')}

}
function securityKey(d){if(pinValue.length>=12)return;pinValue+=d;updatePinUI('')}
function securityBack(){pinValue=pinValue.slice(0,-1);updatePinUI('')}

  if(pinValue.length<4){renderSecurityAuth(pendingSecurityAction==='change'?'Change password':'Remove password protection','Enter your current password to continue.','Use at least 4 digits.');return}
  const ok=await verifyPin(pinValue);
  if(!ok){pinValue='';renderSecurityAuth(pendingSecurityAction==='change'?'Change password':'Remove password protection','Enter your current password to continue.','Incorrect current password.');return}
  if(pendingSecurityAction==='change'){pinValue='';pinFirst='';pinMode='change-new';renderPasswordSetup('Current password accepted. Choose the new password.');}

function renderRemoveWarning(){
 const lock=$('#dlg .dg');if(!lock)return;

function confirmRemovePassword(){clearPassword();localStorage.removeItem('om_last_active');dc();toast('Password protection removed');R0()}
function exportData(){
  try{
    const payload={format:'ObjectiveManager',version:1,exportedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(S))};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a'),url=URL.createObjectURL(blob),d=new Date();
    const z=n=>String(n).padStart(2,'0');
    const name=`ObjectiveManager_${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}.bak`;
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    touch();toast('Backup exported');
  }catch(e){toast('Export failed');}
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const p=JSON.parse(reader.result);
      if(p.format!=='ObjectiveManager'||!p.data||!Array.isArray(p.data.objs)||typeof p.data.days!=='object')throw new Error();
      if(!p.data.goal||!p.data.id)throw new Error();
      S=p.data;S.objs.forEach(o=>{if(!o.reminder)o.reminder={enabled:false,time:'09:00',last:''};});save();tab='h';mo=0;PV=null;E=null;R0();toast('Backup restored');
    }catch(e){toast('Invalid ObjectiveManager backup');}
    $('#importFile').value='';
  };
  reader.readAsText(file);
